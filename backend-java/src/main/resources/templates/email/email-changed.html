<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f4f4f5;margin:0;padding:0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table width="540" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;max-width:540px;">
        <tr>
          <td style="padding:28px 32px 20px;background:#09090b;">
            <p style="margin:0;color:#ffffff;font-size:20px;font-weight:700;">AgendePro</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            <h2 style="margin:0 0 12px;font-size:22px;color:#09090b;">Seu e-mail de acesso foi alterado</h2>
            <p style="margin:0 0 20px;color:#52525b;font-size:15px;line-height:1.6;">
              Olá, <strong th:text="${userName}">usuário</strong>. O e-mail de acesso da sua conta AgendePro
              foi alterado para <strong th:text="${newEmail}">novo@email.com</strong>. A partir de agora,
              use esse endereço para entrar.
            </p>
            <p style="margin:0;color:#52525b;font-size:15px;line-height:1.6;">
              Se você não fez essa alteração, use a opção "Não consigo acessar meu e-mail" na tela de
              login para pedir ajuda.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
