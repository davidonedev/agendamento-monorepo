app:
  seed:
    enabled: false
  jwt:
    secret: test-secret-key-for-integration-tests-only-not-for-production-use
    expires-in: 1h
  cors:
    origins: http://localhost:5173
  # Todos os testes vêm do mesmo IP — limites altos para não interferirem entre si.
  # O comportamento do RateLimitFilter é coberto por RateLimitFilterTest (unitário).
  rate-limit:
    auth-capacity: 100000
    api-capacity: 100000
    login-capacity: 100000
    forgot-password-capacity: 100000
    reset-password-capacity: 100000
    email-change-capacity: 100000
    access-help-capacity: 100000
    login-failures-per-email: 5

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
